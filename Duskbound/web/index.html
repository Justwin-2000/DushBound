<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#17242b">
  <meta name="description" content="暮边镇：余烬初巡。提起界灯，走进灰风原野。一段可离线游玩的横屏动作角色扮演冒险。">
  <title>暮边镇 · 余烬初巡</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./compat.js"></script>
</head>
<body>
<main id="app">
  <canvas id="world" aria-label="暮边镇游戏场景"></canvas>
  <section id="title-screen" class="title-screen">
    <div class="title-shade"></div>
    <div class="title-top"><span class="small-lamp">♢</span> 一盏灯，一条归家的路。<span class="edition">第一章</span></div>
    <div class="title-content"><div class="eyebrow">D U S K B O U N D</div><h1>暮边镇</h1><div class="title-rule"><i></i><span>余 烬 初 巡</span><i></i></div>
      <p class="title-poem">雾会带走名字。<br>灯会记得归来的人。</p>
      <div id="title-ending" class="ending-badge hidden">◇ 余烬已燃</div>
      <div class="title-actions"><button id="continue-game" class="primary" disabled><span>继续旅程</span><span>→</span></button><button id="new-game" class="secondary"><span>开始新旅程</span><span>＋</span></button></div>
      <div class="title-links"><button id="title-settings">设置</button><span>·</span><button id="title-help">操作说明</button><span>·</span><button id="title-credits">关于</button></div>
      <p id="save-info" class="save-info">提灯已备好，等你出发。</p>
    </div>
    <footer class="title-footer"><span>单人冒险 · 完全离线</span><span>触控 / 键盘 <b>v1.0.5</b></span></footer>
  </section>
  <section id="hud" class="hud hidden" aria-label="游戏状态">
    <div class="player-hud"><button id="pause" class="square-button" aria-label="暂停游戏"><span class="pause-icon"></span></button><div class="vitals"><div class="vitals-heading"><strong>巡界者</strong><span id="hp-text">100 / 100</span></div><div class="bar health"><i id="hp-fill"></i></div><div class="bar stamina"><i id="stamina-fill"></i></div><div id="corruption-row" class="corruption hidden"><span>侵蚀</span><div class="bar"><i id="corruption-fill"></i></div><b id="corruption-text">0</b></div></div></div>
    <button id="quest-button" class="quest-chip"><span>◇</span><span id="quest-text"></span><small>›</small></button>
    <div class="place-hud"><span id="place-subtitle"></span><strong id="place-name">暮边镇</strong><div id="room-dots"></div></div>
    <div class="top-actions"><button id="map-button" class="square-button" aria-label="查看地图"></button><button id="bag-button" class="square-button" aria-label="打开行囊"></button><button id="potion" class="potion-button" aria-label="使用恢复药剂"><span id="potion-icon"></span><span><small>药剂</small><b id="potion-count">2</b></span><kbd>H</kbd></button></div>
    <div id="boss-hud" class="boss-hud hidden"><div><span>失灯守卫</span><small id="boss-phase">守灯人的残影</small><b id="boss-value"></b></div><div class="bar"><i id="boss-fill"></i></div></div>
    <div id="tutorial" class="tutorial hidden"><span>格伦的训练</span><strong id="tutorial-text"></strong></div>
    <div class="bottom-info"><span id="coins-text">旧币 0</span><span id="iron-text">灰铁 0</span><span id="save-indicator">自动保存</span></div>
  </section>
  <section id="touch-controls" class="touch-controls hidden" aria-label="触控操作">
    <div id="joystick" class="joystick" aria-label="移动摇杆" role="application"><i class="stick-cross"></i><span id="stick-knob"></span><small>移动</small></div>
    <div class="action-cluster"><button id="block" class="action block" aria-label="按住格挡"><span class="action-icon"></span><strong>格挡</strong><kbd>L</kbd></button><button id="dodge" class="action dodge" aria-label="闪避"><span class="action-icon"></span><strong>闪避</strong><kbd>K</kbd></button><button id="attack" class="action attack" aria-label="普通攻击"><span class="action-icon"></span><strong>攻击</strong><kbd>J</kbd></button></div>
    <button id="interact" class="interact-button hidden"><span id="interact-label">交谈</span><kbd>E</kbd></button>
  </section>
  <div id="region" class="region hidden"><span id="region-subtitle"></span><strong id="region-title"></strong><i></i></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="dialog-layer" class="dialog-layer hidden"><div class="dialog-card"><div id="dialog-portrait" class="dialog-portrait"></div><div class="dialog-body"><div class="dialog-header"><strong id="dialog-speaker"></strong><small id="dialog-index"></small></div><button id="dialog-text" class="dialog-text"></button><div id="dialog-choices" class="dialog-choices"></div></div></div></div>
  <div id="modal-layer" class="modal-layer hidden"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><div><span id="modal-kicker">巡界手记</span><h2 id="modal-title"></h2></div><button id="close-modal" class="square-button" aria-label="关闭菜单">×</button></header><div id="modal-body" class="modal-body"></div></section></div>
  <div id="rotate-hint" class="rotate-hint"><div class="rotate-phone"></div><h2>横过手机，提灯出发</h2><p>横屏能看清道路，也能腾出双手战斗。</p><button id="fullscreen-button" class="primary">进入横屏</button></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="fatal" class="fatal hidden" role="alert"></div>
</main>
<script src="./app.bundle.js"></script>
</body>
</html>
